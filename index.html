<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table Seating</title>
  <style>
    :root {
      --bg: #eef2f4;
      --panel: #ffffff;
      --ink: #14212b;
      --muted: #5a6b78;
      --line: #cfd8df;
      --accent: #0f766e;
      --accent-hover: #0d9488;
      --accent-soft: #ccfbf1;
      --warn: #b45309;
      --warn-soft: #ffedd5;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --shadow: 0 10px 28px rgba(20, 33, 43, 0.07);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.08), transparent 35%),
        linear-gradient(180deg, #f5f8fa, var(--bg));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(245, 248, 250, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1.25rem;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }

    .tab {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font: inherit;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    button, .file-btn {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      background: white;
      color: var(--ink);
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.primary:hover { background: var(--accent-hover); }

    button.danger {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .file-btn { display: inline-block; }
    .file-btn input { display: none; }

    main {
      padding: 1rem 1.25rem 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .view { display: none; }
    .view.active { display: block; }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .chip {
      font-size: 0.8rem;
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .chip strong { color: var(--ink); }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.9rem;
    }

    .panel h2 {
      margin: 0 0 0.7rem;
      font-size: 0.95rem;
    }

    .stack { display: grid; gap: 0.55rem; }

    .row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    input, select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      background: white;
      color: var(--ink);
      width: 100%;
    }

    .row input, .row select, .row button { width: auto; flex: 1 1 auto; }

    .person-list, .unassigned {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.35rem;
      max-height: 420px;
      overflow: auto;
    }

    .person-item, .seat-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafb;
    }

    .person-item.dragging, .seat-card.dragging {
      opacity: 0.55;
    }

    .person-item .name, .seat-card .name {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .icon-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
      flex: 0 0 auto;
      width: auto;
    }

    .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }

    .floor-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(15, 118, 110, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(15, 118, 110, 0.05) 1px, transparent 1px),
        #fbfcfd;
      background-size: 24px 24px;
      box-shadow: var(--shadow);
      overflow: auto;
      max-height: min(75vh, 900px);
      min-height: 520px;
      position: relative;
      touch-action: pan-x pan-y;
    }

    .floor-canvas {
      position: relative;
      min-width: 900px;
      min-height: 640px;
    }

    .floor-canvas.empty-floor {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-card {
      position: absolute;
      width: 260px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      overflow: hidden;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 20px rgba(20, 33, 43, 0.08);
      transition: box-shadow 0.15s ease, outline 0.15s ease;
      z-index: 1;
      user-select: none;
    }

    .table-card.moving {
      z-index: 20;
      box-shadow: 0 16px 36px rgba(20, 33, 43, 0.18);
      opacity: 0.96;
    }

    .table-card.drag-over {
      outline: 2px solid var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .table-card.full {
      border-color: #fdba74;
    }

    .table-card.over {
      border-color: #fca5a5;
      background: #fff7f7;
    }

    .table-move-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.35rem 0.5rem;
      background: #ecfdf5;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: grab;
      touch-action: none;
    }

    .table-move-handle:active { cursor: grabbing; }

    .table-move-handle .grip {
      letter-spacing: 0.12em;
      opacity: 0.7;
    }

    .table-head {
      padding: 0.7rem 0.8rem;
      background: linear-gradient(180deg, #f0fdfa, #ffffff);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: start;
    }

    .table-title {
      margin: 0;
      font-size: 1rem;
    }

    .capacity {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .capacity.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .capacity.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .table-body {
      padding: 0.65rem;
      display: grid;
      gap: 0.35rem;
      flex: 1;
      min-height: 90px;
    }

    .table-body.empty-state {
      place-items: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .table-foot {
      padding: 0.5rem 0.65rem;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .table-foot select { flex: 1 1 120px; }

    .display-floor-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(15, 118, 110, 0.05) 1px, transparent 1px),
        linear-gradient(rgba(15, 118, 110, 0.05) 1px, transparent 1px),
        white;
      background-size: 24px 24px;
      overflow: auto;
      min-height: 520px;
    }

    .display-card {
      position: absolute;
      width: 260px;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .display-card.unassigned-card {
      width: 280px;
    }

    .display-card header.card-h {
      position: static;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.85rem 1rem;
    }

    .display-card header.card-h h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .display-card header.card-h p {
      margin: 0.2rem 0 0;
      opacity: 0.85;
      font-size: 0.85rem;
    }

    .display-card ol {
      margin: 0;
      padding: 0.85rem 1rem 1rem 2rem;
    }

    .display-card li {
      padding: 0.25rem 0;
      font-size: 1rem;
    }

    .display-empty {
      padding: 1rem;
      color: var(--muted);
      font-style: italic;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      align-items: center;
    }

    .toolbar input[type="search"] {
      max-width: 240px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.86rem;
      margin: 0 0 0.85rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 33, 43, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: white;
      border-radius: 14px;
      padding: 1rem;
      width: min(480px, 100%);
      box-shadow: var(--shadow);
    }

    .modal h3 { margin: 0 0 0.7rem; }
    .modal .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.4rem;
      margin-top: 0.85rem;
    }

    @media print {
      header .header-actions,
      header .tabs,
      .no-print,
      #view-assign { display: none !important; }

      #view-display { display: block !important; }

      body { background: white; }
      header {
        position: static;
        background: white;
        border: none;
        padding-bottom: 0;
      }
      .display-floor-wrap {
        overflow: visible;
        border: none;
        min-height: 0;
      }
      .display-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1>Table Seating</h1>
        <p class="sub">Assign guests, then flip to Display for a clean seating chart.</p>
      </div>
      <div class="header-actions no-print">
        <button type="button" id="btnPrint">Print chart</button>
        <button type="button" id="btnExport">Export JSON</button>
        <label class="file-btn">Import JSON<input type="file" id="importFile" accept="application/json,.json" /></label>
        <button type="button" class="danger" id="btnReset">Reset</button>
      </div>
    </div>
    <div class="tabs no-print" role="tablist">
      <button type="button" class="tab active" data-view="assign" role="tab">Assign</button>
      <button type="button" class="tab" data-view="display" role="tab">Display</button>
    </div>
  </header>

  <main>
    <div class="stats no-print" id="stats"></div>

    <!-- ASSIGN VIEW -->
    <section id="view-assign" class="view active">
      <p class="hint">Drag the green handle to move tables around the floor. Drag people onto tables, or use each table’s dropdown. Double-click a table name to rename.</p>
      <div class="layout">
        <aside class="stack">
          <div class="panel">
            <h2>Add people</h2>
            <div class="stack">
              <input id="personInput" placeholder="Name (or paste several lines)" />
              <textarea id="bulkPeople" rows="3" placeholder="Bulk paste: one name per line"></textarea>
              <div class="row">
                <button type="button" class="primary" id="addPeople">Add</button>
                <label class="file-btn">Upload CSV<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" /></label>
              </div>
              <button type="button" id="shuffleUnassigned">Shuffle unassigned</button>
            </div>
          </div>

          <div class="panel">
            <h2>Tables</h2>
            <div class="stack">
              <div class="row">
                <input id="tableName" placeholder="Table name" />
                <input id="tableCap" type="number" min="1" max="50" value="8" title="Capacity" style="max-width:5rem" />
              </div>
              <div class="row">
                <button type="button" class="primary" id="addTable">Add table</button>
                <button type="button" id="autoFill">Auto-fill</button>
              </div>
              <button type="button" id="autoArrange">Auto-arrange layout</button>
            </div>
          </div>

          <div class="panel">
            <h2>Unassigned <span class="meta" id="unassignedCount"></span></h2>
            <ul class="unassigned" id="unassignedList"></ul>
          </div>
        </aside>

        <section>
          <div class="toolbar no-print">
            <input type="search" id="searchPeople" placeholder="Search people…" />
            <select id="filterTable">
              <option value="ALL">All tables</option>
            </select>
          </div>
          <div class="floor-wrap" id="floorWrap">
            <div class="floor-canvas" id="tablesGrid"></div>
          </div>
        </section>
      </div>
    </section>

    <!-- DISPLAY VIEW -->
    <section id="view-display" class="view">
      <div class="toolbar no-print">
        <label class="chip" style="cursor:pointer">
          <input type="checkbox" id="hideEmptyDisplay" /> Hide empty tables
        </label>
        <label class="chip" style="cursor:pointer">
          <input type="checkbox" id="showUnassignedDisplay" checked /> Show unassigned
        </label>
      </div>
      <div class="display-floor-wrap">
        <div class="floor-canvas" id="displayGrid"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h3>Edit table</h3>
      <div class="stack">
        <label>
          <span class="meta">Name</span>
          <input id="editTableName" />
        </label>
        <label>
          <span class="meta">Capacity</span>
          <input id="editTableCap" type="number" min="1" max="50" />
        </label>
      </div>
      <div class="actions">
        <button type="button" class="danger" id="deleteTable">Delete table</button>
        <button type="button" id="cancelEdit">Cancel</button>
        <button type="button" class="primary" id="saveEdit">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "table-seating-v1";
    const TABLE_W = 260;
    const TABLE_GAP = 24;
    const TABLE_EST_H = 220;

    const state = {
      people: [], // { id, name, tableId: null|string }
      tables: [], // { id, name, capacity, x, y }
      editingTableId: null,
    };

    const uid = () => Math.random().toString(36).slice(2, 10);

    function gridPosition(index) {
      const cols = 3;
      const col = index % cols;
      const row = Math.floor(index / cols);
      return {
        x: 24 + col * (TABLE_W + TABLE_GAP),
        y: 24 + row * (TABLE_EST_H + TABLE_GAP),
      };
    }

    function nextTablePos() {
      return gridPosition(state.tables.length);
    }

    function ensureTablePositions(tables) {
      return tables.map((t, i) => {
        const fallback = gridPosition(i);
        return {
          ...t,
          capacity: Math.max(1, Number(t.capacity) || 8),
          x: Number.isFinite(t.x) ? t.x : fallback.x,
          y: Number.isFinite(t.y) ? t.y : fallback.y,
        };
      });
    }

    function defaultState() {
      const tables = [1, 2, 3].map((n, i) => {
        const pos = gridPosition(i);
        return { id: uid(), name: `Table ${n}`, capacity: 8, x: pos.x, y: pos.y };
      });
      return { people: [], tables };
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const data = JSON.parse(raw);
        return {
          people: Array.isArray(data.people) ? data.people : [],
          tables: ensureTablePositions(Array.isArray(data.tables) ? data.tables : defaultState().tables),
        };
      } catch {
        return defaultState();
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        people: state.people,
        tables: state.tables,
      }));
    }

    function hydrate() {
      const data = load();
      state.people = data.people;
      state.tables = ensureTablePositions(data.tables);
    }

    function canvasSize(tables, extra = null) {
      const items = tables.slice();
      if (extra) items.push(extra);
      let maxX = 900;
      let maxY = 640;
      for (const t of items) {
        maxX = Math.max(maxX, (t.x || 0) + TABLE_W + 48);
        maxY = Math.max(maxY, (t.y || 0) + TABLE_EST_H + 80);
      }
      return { width: maxX, height: maxY };
    }

    function sizeCanvas(el, tables, extra = null) {
      const { width, height } = canvasSize(tables, extra);
      el.style.width = `${width}px`;
      el.style.height = `${height}px`;
      el.style.minWidth = `${width}px`;
      el.style.minHeight = `${height}px`;
    }

    function autoArrangeLayout() {
      state.tables.forEach((t, i) => {
        const pos = gridPosition(i);
        t.x = pos.x;
        t.y = pos.y;
      });
      save();
      render();
    }

    function normalizeName(name) {
      return name.trim().replace(/\s+/g, " ");
    }

    function addPeopleFromText(text) {
      const lines = text
        .split(/[\n;]+/)
        .map(normalizeName)
        .filter(Boolean);

      const existing = new Set(state.people.map((p) => p.name.toLowerCase()));
      let added = 0;
      for (const name of lines) {
        if (isPlaceholderName(name)) continue;
        if (existing.has(name.toLowerCase())) continue;
        state.people.push({ id: uid(), name, tableId: null });
        existing.add(name.toLowerCase());
        added += 1;
      }
      save();
      render();
      return added;
    }

    function isPlaceholderName(name) {
      return ["guest", "tba", "tbd", "+1", "plus one"].includes(name.toLowerCase());
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      const src = text.replace(/^\uFEFF/, "");
      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        const next = src[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { cell += '"'; i += 1; }
          else if (ch === '"') inQuotes = false;
          else cell += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ",") { row.push(cell); cell = ""; }
        else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
        else if (ch !== "\r") cell += ch;
      }
      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }
      return rows.filter((r) => r.some((c) => String(c).trim()));
    }

    function namesFromCsvText(text) {
      const rows = parseCsv(text);
      if (!rows.length) return [];

      const header = rows[0].map((h) => h.trim().toLowerCase());
      const firstIdx = header.indexOf("first name");
      const lastIdx = header.indexOf("last name");

      if (firstIdx !== -1 && lastIdx !== -1) {
        const col = (h) => header.indexOf(h);
        const partnerFirst = col("partner first name");
        const partnerLast = col("partner last name");
        const names = [];
        const push = (first, last, fallbackLast) => {
          const f = normalizeName(first || "");
          const l = normalizeName(last || "") || normalizeName(fallbackLast || "");
          if (!f || isPlaceholderName(f)) return;
          names.push([f, l].filter(Boolean).join(" "));
        };
        for (const r of rows.slice(1)) {
          const familyLast = r[lastIdx] || "";
          push(r[firstIdx], r[lastIdx]);
          if (partnerFirst !== -1) push(r[partnerFirst], partnerLast === -1 ? "" : r[partnerLast], familyLast);
          for (let i = 1; i <= 5; i++) {
            const cf = col(`child ${i} first name`);
            const cl = col(`child ${i} last name`);
            if (cf !== -1) push(r[cf], cl === -1 ? "" : r[cl], familyLast);
          }
        }
        return names;
      }

      return rows.flat().map((c) => normalizeName(c)).filter((name) => name && !["name", "names", "guest", "full name"].includes(name.toLowerCase()));
    }

    function peopleAt(tableId) {
      return state.people.filter((p) => p.tableId === tableId);
    }

    function unassigned() {
      return state.people.filter((p) => !p.tableId);
    }

    function setView(view) {
      document.querySelectorAll(".view").forEach((el) => el.classList.toggle("active", el.id === `view-${view}`));
      document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.view === view));
      render();
    }

    function capacityClass(count, capacity) {
      if (count > capacity) return "danger";
      if (count >= capacity) return "warn";
      return "";
    }

    function renderStats() {
      const assigned = state.people.filter((p) => p.tableId).length;
      const openSeats = state.tables.reduce((sum, t) => sum + Math.max(0, t.capacity - peopleAt(t.id).length), 0);
      document.getElementById("stats").innerHTML = `
        <span class="chip">People <strong>${state.people.length}</strong></span>
        <span class="chip">Assigned <strong>${assigned}</strong></span>
        <span class="chip">Unassigned <strong>${unassigned().length}</strong></span>
        <span class="chip">Tables <strong>${state.tables.length}</strong></span>
        <span class="chip">Open seats <strong>${openSeats}</strong></span>
      `;
    }

    function renderUnassigned() {
      const list = document.getElementById("unassignedList");
      const people = unassigned();
      document.getElementById("unassignedCount").textContent = `(${people.length})`;
      if (!people.length) {
        list.innerHTML = `<li class="meta" style="padding:0.4rem">Everyone is seated</li>`;
        return;
      }
      list.innerHTML = people.map((p) => `
        <li class="person-item" draggable="true" data-person-id="${p.id}">
          <span class="name">${escapeHtml(p.name)}</span>
          <button type="button" class="icon-btn" data-remove-person="${p.id}" title="Remove">✕</button>
        </li>
      `).join("");
    }

    function renderFilterOptions() {
      const select = document.getElementById("filterTable");
      const current = select.value;
      select.innerHTML = `<option value="ALL">All tables</option>` +
        state.tables.map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
      if ([...select.options].some((o) => o.value === current)) select.value = current;
    }

    function renderTables() {
      const q = document.getElementById("searchPeople").value.trim().toLowerCase();
      const filter = document.getElementById("filterTable").value;
      const grid = document.getElementById("tablesGrid");

      const tables = state.tables.filter((t) => filter === "ALL" || t.id === filter);

      if (!tables.length) {
        grid.classList.add("empty-floor");
        grid.style.width = "";
        grid.style.height = "";
        grid.style.minWidth = "";
        grid.style.minHeight = "";
        grid.innerHTML = `<p class="meta">No tables yet. Add one on the left.</p>`;
        return;
      }

      grid.classList.remove("empty-floor");
      sizeCanvas(grid, tables);

      grid.innerHTML = tables.map((t) => {
        let seated = peopleAt(t.id);
        if (q) seated = seated.filter((p) => p.name.toLowerCase().includes(q));
        const count = peopleAt(t.id).length;
        const capCls = capacityClass(count, t.capacity);
        const cardCls = count > t.capacity ? "over" : count >= t.capacity ? "full" : "";
        const options = unassigned().map((p) =>
          `<option value="${p.id}">${escapeHtml(p.name)}</option>`
        ).join("");

        return `
          <article class="table-card ${cardCls}" data-table-id="${t.id}" style="left:${t.x}px;top:${t.y}px;width:${TABLE_W}px">
            <div class="table-move-handle" data-move-table="${t.id}" title="Drag to move table">
              <span class="grip">⋮⋮</span> Move table
            </div>
            <div class="table-head">
              <div>
                <h3 class="table-title" data-rename="${t.id}" title="Double-click to rename">${escapeHtml(t.name)}</h3>
                <div class="meta">${count} seated</div>
              </div>
              <div style="display:flex;gap:0.35rem;align-items:center">
                <span class="capacity ${capCls}">${count}/${t.capacity}</span>
                <button type="button" class="icon-btn" data-edit-table="${t.id}" title="Edit">✎</button>
              </div>
            </div>
            <div class="table-body ${seated.length ? "" : "empty-state"}" data-drop-table="${t.id}">
              ${seated.length ? seated.map((p) => `
                <div class="seat-card" draggable="true" data-person-id="${p.id}">
                  <span class="name">${escapeHtml(p.name)}</span>
                  <button type="button" class="icon-btn" data-unseat="${p.id}" title="Unassign">↩</button>
                </div>
              `).join("") : "Drop people here"}
            </div>
            <div class="table-foot">
              <select data-assign-to="${t.id}">
                <option value="">Add person…</option>
                ${options}
              </select>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderDisplay() {
      const hideEmpty = document.getElementById("hideEmptyDisplay").checked;
      const showUnassigned = document.getElementById("showUnassignedDisplay").checked;
      const grid = document.getElementById("displayGrid");

      const tables = state.tables.filter((t) => !hideEmpty || peopleAt(t.id).length);

      if (!tables.length && !showUnassigned) {
        grid.classList.add("empty-floor");
        grid.innerHTML = `<p class="meta">Nothing to display yet.</p>`;
        return;
      }

      grid.classList.remove("empty-floor");
      const extra = showUnassigned
        ? { x: Math.max(...(tables.length ? tables.map((t) => t.x || 0) : [24]), 24) + TABLE_W + 40, y: 24 }
        : null;
      sizeCanvas(grid, tables, extra);

      const cards = tables.map((t) => {
        const seated = peopleAt(t.id).slice().sort((a, b) => a.name.localeCompare(b.name));
        return `
          <article class="display-card" style="left:${t.x}px;top:${t.y}px">
            <header class="card-h">
              <h3>${escapeHtml(t.name)}</h3>
              <p>${seated.length} / ${t.capacity} seats</p>
            </header>
            ${seated.length
              ? `<ol>${seated.map((p) => `<li>${escapeHtml(p.name)}</li>`).join("")}</ol>`
              : `<div class="display-empty">No one assigned</div>`}
          </article>
        `;
      });

      if (showUnassigned) {
        const open = unassigned().slice().sort((a, b) => a.name.localeCompare(b.name));
        const ux = extra.x;
        const uy = extra.y;
        cards.push(`
          <article class="display-card unassigned-card" style="left:${ux}px;top:${uy}px">
            <header class="card-h" style="background:#334155">
              <h3>Unassigned</h3>
              <p>${open.length} people</p>
            </header>
            ${open.length
              ? `<ol>${open.map((p) => `<li>${escapeHtml(p.name)}</li>`).join("")}</ol>`
              : `<div class="display-empty">Everyone is seated</div>`}
          </article>
        `);
      }

      grid.innerHTML = cards.join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      renderStats();
      renderFilterOptions();
      renderUnassigned();
      renderTables();
      renderDisplay();
      bindDrag();
      bindTableMove();
    }

    function assignPerson(personId, tableId) {
      const person = state.people.find((p) => p.id === personId);
      if (!person) return;
      person.tableId = tableId;
      save();
      render();
    }

    function autoFill() {
      const open = unassigned();
      if (!open.length || !state.tables.length) return;
      const seats = [];
      for (const t of state.tables) {
        const free = Math.max(0, t.capacity - peopleAt(t.id).length);
        for (let i = 0; i < free; i++) seats.push(t.id);
      }
      // shuffle seats
      for (let i = seats.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [seats[i], seats[j]] = [seats[j], seats[i]];
      }
      const shuffledPeople = open.slice();
      for (let i = shuffledPeople.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledPeople[i], shuffledPeople[j]] = [shuffledPeople[j], shuffledPeople[i]];
      }
      const n = Math.min(seats.length, shuffledPeople.length);
      for (let i = 0; i < n; i++) {
        shuffledPeople[i].tableId = seats[i];
      }
      save();
      render();
    }

    let dragPersonId = null;
    let tableMove = null;

    function bindDrag() {
      document.querySelectorAll("[data-person-id][draggable='true']").forEach((el) => {
        el.addEventListener("dragstart", (e) => {
          dragPersonId = el.dataset.personId;
          el.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", dragPersonId);
        });
        el.addEventListener("dragend", () => {
          el.classList.remove("dragging");
          dragPersonId = null;
          document.querySelectorAll(".table-card").forEach((c) => c.classList.remove("drag-over"));
        });
      });

      document.querySelectorAll(".table-card").forEach((card) => {
        const tableId = card.dataset.tableId;
        card.addEventListener("dragover", (e) => {
          e.preventDefault();
          card.classList.add("drag-over");
        });
        card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
        card.addEventListener("drop", (e) => {
          e.preventDefault();
          card.classList.remove("drag-over");
          const id = e.dataTransfer.getData("text/plain") || dragPersonId;
          if (id) assignPerson(id, tableId);
        });
      });
    }

    function bindTableMove() {
      document.querySelectorAll("[data-move-table]").forEach((handle) => {
        handle.addEventListener("pointerdown", (e) => {
          if (e.button != null && e.button !== 0) return;
          const tableId = handle.dataset.moveTable;
          const table = state.tables.find((t) => t.id === tableId);
          const card = handle.closest(".table-card");
          const canvas = document.getElementById("tablesGrid");
          if (!table || !card || !canvas) return;

          e.preventDefault();
          handle.setPointerCapture(e.pointerId);
          card.classList.add("moving");

          const canvasRect = canvas.getBoundingClientRect();
          tableMove = {
            tableId,
            card,
            handle,
            startX: e.clientX,
            startY: e.clientY,
            origX: table.x,
            origY: table.y,
            canvas,
            canvasRect,
          };
        });

        handle.addEventListener("pointermove", (e) => {
          if (!tableMove || tableMove.handle !== handle) return;
          const dx = e.clientX - tableMove.startX;
          const dy = e.clientY - tableMove.startY;
          const x = Math.max(0, tableMove.origX + dx);
          const y = Math.max(0, tableMove.origY + dy);
          tableMove.card.style.left = `${x}px`;
          tableMove.card.style.top = `${y}px`;
          sizeCanvas(tableMove.canvas, state.tables, { x, y });
        });

        const endMove = (e) => {
          if (!tableMove || tableMove.handle !== handle) return;
          const table = state.tables.find((t) => t.id === tableMove.tableId);
          if (table) {
            const left = parseFloat(tableMove.card.style.left);
            const top = parseFloat(tableMove.card.style.top);
            if (Number.isFinite(left) && Number.isFinite(top)) {
              table.x = Math.max(0, Math.round(left));
              table.y = Math.max(0, Math.round(top));
            } else {
              const dx = e.clientX - tableMove.startX;
              const dy = e.clientY - tableMove.startY;
              table.x = Math.max(0, Math.round(tableMove.origX + dx));
              table.y = Math.max(0, Math.round(tableMove.origY + dy));
            }
          }
          tableMove.card.classList.remove("moving");
          try { handle.releasePointerCapture(e.pointerId); } catch {}
          tableMove = null;
          save();
          renderDisplay();
          sizeCanvas(document.getElementById("tablesGrid"), state.tables);
        };

        handle.addEventListener("pointerup", endMove);
        handle.addEventListener("pointercancel", endMove);
      });
    }

    // Events
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => setView(tab.dataset.view));
    });

    document.getElementById("addPeople").addEventListener("click", () => {
      const single = document.getElementById("personInput").value;
      const bulk = document.getElementById("bulkPeople").value;
      const added = addPeopleFromText([single, bulk].filter(Boolean).join("\n"));
      document.getElementById("personInput").value = "";
      document.getElementById("bulkPeople").value = "";
      if (!added) alert("No new names added (empty or already listed).");
    });

    document.getElementById("personInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("addPeople").click();
    });

    document.getElementById("addTable").addEventListener("click", () => {
      const name = normalizeName(document.getElementById("tableName").value) || `Table ${state.tables.length + 1}`;
      const capacity = Math.max(1, Number(document.getElementById("tableCap").value) || 8);
      const pos = nextTablePos();
      state.tables.push({ id: uid(), name, capacity, x: pos.x, y: pos.y });
      document.getElementById("tableName").value = "";
      save();
      render();
    });

    document.getElementById("autoArrange").addEventListener("click", autoArrangeLayout);

    document.getElementById("autoFill").addEventListener("click", () => {
      if (!unassigned().length) return alert("No unassigned people.");
      autoFill();
    });

    document.getElementById("shuffleUnassigned").addEventListener("click", () => {
      const open = unassigned();
      for (let i = open.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const ia = state.people.indexOf(open[i]);
        const ib = state.people.indexOf(open[j]);
        [state.people[ia], state.people[ib]] = [state.people[ib], state.people[ia]];
      }
      save();
      render();
    });

    document.getElementById("searchPeople").addEventListener("input", renderTables);
    document.getElementById("filterTable").addEventListener("change", renderTables);
    document.getElementById("hideEmptyDisplay").addEventListener("change", renderDisplay);
    document.getElementById("showUnassignedDisplay").addEventListener("change", renderDisplay);

    document.getElementById("tablesGrid").addEventListener("change", (e) => {
      const select = e.target.closest("select[data-assign-to]");
      if (!select || !select.value) return;
      assignPerson(select.value, select.dataset.assignTo);
    });

    document.getElementById("tablesGrid").addEventListener("click", (e) => {
      const unseat = e.target.closest("[data-unseat]");
      if (unseat) {
        assignPerson(unseat.dataset.unseat, null);
        return;
      }
      const edit = e.target.closest("[data-edit-table]");
      if (edit) openEdit(edit.dataset.editTable);
    });

    document.getElementById("tablesGrid").addEventListener("dblclick", (e) => {
      const title = e.target.closest("[data-rename]");
      if (!title) return;
      openEdit(title.dataset.rename);
    });

    document.getElementById("unassignedList").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove-person]");
      if (!btn) return;
      state.people = state.people.filter((p) => p.id !== btn.dataset.removePerson);
      save();
      render();
    });

    // Drop back to unassigned
    document.getElementById("unassignedList").addEventListener("dragover", (e) => e.preventDefault());
    document.getElementById("unassignedList").addEventListener("drop", (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain") || dragPersonId;
      if (id) assignPerson(id, null);
    });

    function openEdit(tableId) {
      const table = state.tables.find((t) => t.id === tableId);
      if (!table) return;
      state.editingTableId = tableId;
      document.getElementById("editTableName").value = table.name;
      document.getElementById("editTableCap").value = table.capacity;
      document.getElementById("editModal").classList.add("open");
    }

    function closeEdit() {
      state.editingTableId = null;
      document.getElementById("editModal").classList.remove("open");
    }

    document.getElementById("cancelEdit").addEventListener("click", closeEdit);
    document.getElementById("editModal").addEventListener("click", (e) => {
      if (e.target.id === "editModal") closeEdit();
    });

    document.getElementById("saveEdit").addEventListener("click", () => {
      const table = state.tables.find((t) => t.id === state.editingTableId);
      if (!table) return closeEdit();
      table.name = normalizeName(document.getElementById("editTableName").value) || table.name;
      table.capacity = Math.max(1, Number(document.getElementById("editTableCap").value) || table.capacity);
      save();
      closeEdit();
      render();
    });

    document.getElementById("deleteTable").addEventListener("click", () => {
      if (!state.editingTableId) return;
      if (!confirm("Delete this table? People will become unassigned.")) return;
      const id = state.editingTableId;
      state.people.forEach((p) => { if (p.tableId === id) p.tableId = null; });
      state.tables = state.tables.filter((t) => t.id !== id);
      save();
      closeEdit();
      render();
    });

    document.getElementById("btnPrint").addEventListener("click", () => {
      setView("display");
      setTimeout(() => window.print(), 50);
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ people: state.people, tables: state.tables }, null, 2)], {
        type: "application/json",
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "table-seating.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById("importFile").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.people) || !Array.isArray(data.tables)) throw new Error("Invalid file");
        state.people = data.people;
        state.tables = ensureTablePositions(data.tables);
        save();
        render();
      } catch {
        alert("Could not import that file.");
      }
      e.target.value = "";
    });

    document.getElementById("csvFile").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const names = namesFromCsvText(await file.text());
        const added = addPeopleFromText(names.join("\n"));
        if (!added) alert("No new names found in that CSV.");
      } catch {
        alert("Could not read that CSV.");
      }
      e.target.value = "";
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      if (!confirm("Reset all people and tables?")) return;
      const fresh = defaultState();
      state.people = fresh.people;
      state.tables = fresh.tables;
      save();
      render();
    });

    hydrate();
    render();
  </script>
</body>
</html>
